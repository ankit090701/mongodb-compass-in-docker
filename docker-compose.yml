name: mongo-compass-poc

services:
  # MongoDB server that Compass connects to (data persisted in a named volume).
  mongo:
    image: mongo:${MONGO_VERSION:-8.0}
    container_name: poc-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro   # seed data, first start only
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # MongoDB Compass desktop app, exposed to the browser via noVNC.
  compass:
    build:
      context: ./compass
      args:
        COMPASS_VERSION: ${COMPASS_VERSION:-1.53.2}
    image: poc/mongodb-compass-web:${COMPASS_VERSION:-1.53.2}
    container_name: poc-compass
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${COMPASS_PORT:-8080}:6080"
    environment:
      VNC_PASSWORD: ${VNC_PASSWORD}
      VNC_RESOLUTION: ${VNC_RESOLUTION:-1600x900}
      # Compass auto-connects to this on start. Remove it to start on the connection screen.
      COMPASS_CONNECTION_STRING: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
    shm_size: 1gb   # Chromium/Electron needs more than Docker's 64 MB default
    volumes:
      - compass-config:/home/compass/.config/MongoDB Compass   # saved connections, history

volumes:
  mongo-data:
  compass-config:
